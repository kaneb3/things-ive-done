<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Things I've Done</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #1d1d1b; --muted: #6b6a66;
    --line: #e3e0d8; --accent: #2f6f4f; --danger: #b3412f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171716; --card: #222220; --ink: #eceae4; --muted: #9a988f;
            --line: #33322f; --accent: #6fbf94; --danger: #e07a66; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.6rem; margin: 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
           padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .entry { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
           overflow: hidden; margin-bottom: 16px; }
  .entry img { width: 100%; max-height: 420px; object-fit: cover; display: block; }
  .entry .body { padding: 14px 16px; }
  .entry h2 { margin: 0 0 2px; font-size: 1.2rem; }
  .entry time { color: var(--muted); font-size: .85rem; }
  .entry p { white-space: pre-wrap; margin: 10px 0 12px; }
  .actions { display: flex; gap: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .backup { display: flex; gap: 8px; justify-content: center; margin-top: 32px; flex-wrap: wrap; }
  .backup button { font-size: .85rem; color: var(--muted); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
           width: min(520px, calc(100% - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], textarea { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  textarea { min-height: 140px; resize: vertical; }
  #preview { max-width: 100%; max-height: 200px; margin-top: 8px; border-radius: 8px; display: none; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Things I've Done</h1>
    <button class="primary" id="newBtn">+ New</button>
  </header>
  <div id="list"></div>
  <div class="backup">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle" style="margin-top:0">New entry</h2>
    <label for="title">Title</label>
    <input type="text" id="title" required>
    <label for="notes">Notes</label>
    <textarea id="notes"></textarea>
    <label for="photo">Photo</label>
    <input type="file" id="photo" accept="image/*">
    <img id="preview" alt="">
    <div class="row">
      <button type="button" id="removePhoto" hidden>Remove photo</button>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
// --- storage: IndexedDB (holds far more than localStorage, so photos fit) ---
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('things-ive-done', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('entries', { keyPath: 'id' });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const tx = async (mode, fn) => {
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction('entries', mode), s = t.objectStore('entries');
    const req = fn(s);
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
};
const all = () => tx('readonly', s => s.getAll());
const put = e => tx('readwrite', s => s.put(e));
const del = id => tx('readwrite', s => s.delete(id));

// --- shrink photos so storage stays small ---
function shrink(file, max = 1200) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

// --- UI ---
const $ = id => document.getElementById(id);
const dlg = $('dlg');
let editing = null, photoData = null;

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function render() {
  const items = (await all()).sort((a, b) => b.created - a.created);
  $('list').innerHTML = items.length ? items.map(e => `
    <article class="entry">
      ${e.photo ? `<img src="${e.photo}" alt="">` : ''}
      <div class="body">
        <h2>${esc(e.title)}</h2>
        <time>${new Date(e.created).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })}</time>
        ${e.notes ? `<p>${esc(e.notes)}</p>` : '<p></p>'}
        <div class="actions">
          <button data-edit="${e.id}">Edit</button>
          <button class="danger" data-del="${e.id}">Delete</button>
        </div>
      </div>
    </article>`).join('')
    : '<div class="empty">Nothing here yet. Hit “+ New” to add your first one.</div>';
}

function open(entry) {
  editing = entry || null;
  photoData = entry ? entry.photo || null : null;
  $('dlgTitle').textContent = entry ? 'Edit entry' : 'New entry';
  $('title').value = entry ? entry.title : '';
  $('notes').value = entry ? entry.notes : '';
  $('photo').value = '';
  showPreview();
  dlg.showModal();
}
function showPreview() {
  $('preview').style.display = photoData ? 'block' : 'none';
  $('preview').src = photoData || '';
  $('removePhoto').hidden = !photoData;
}

$('newBtn').onclick = () => open();
$('cancelBtn').onclick = () => dlg.close();
$('removePhoto').onclick = () => { photoData = null; $('photo').value = ''; showPreview(); };
$('photo').onchange = async e => {
  const f = e.target.files[0];
  if (f) { photoData = await shrink(f); showPreview(); }
};
$('form').onsubmit = async e => {
  e.preventDefault();
  const title = $('title').value.trim();
  if (!title) return;
  await put({
    id: editing ? editing.id : crypto.randomUUID(),
    created: editing ? editing.created : Date.now(),
    title, notes: $('notes').value.trim(), photo: photoData
  });
  dlg.close();
  render();
};
$('list').onclick = async e => {
  const ed = e.target.dataset.edit, dl = e.target.dataset.del;
  if (ed) open((await all()).find(x => x.id === ed));
  if (dl && confirm('Delete this entry?')) { await del(dl); render(); }
};

// --- backup ---
$('exportBtn').onclick = async () => {
  const blob = new Blob([JSON.stringify(await all())], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `things-ive-done-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const items = JSON.parse(await f.text());
    for (const it of items) if (it.id && it.title) await put(it);
    render();
  } catch { alert("That file doesn't look like a backup."); }
  e.target.value = '';
};

render();
</script>
</body>
</html>
